name: Update Lao lottery

on:
  schedule:
    - cron: '0 14 * * 1-5'    # 21:00 น. เวลาไทย (หลังหวยออก ~20:30)
    - cron: '30 15 * * 1-5'   # 22:30 น. รอบสำรอง เผื่อรอบแรกพลาดหรือเว็บอัปเดตช้า
  workflow_dispatch:           # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - name: Scrape and embed into index.html
        run: python update_html.py --scrape --csv laolotto.csv --html index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laolotto.csv index.html
          git diff --staged --quiet || git commit -m "Update Lao lottery results $(date -u +%F)"
          git push

